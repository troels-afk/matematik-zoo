<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../icon.svg">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Ikonkrydset</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Patrick+Hand&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: Scandinavian arrow-word grid; clue cells hold pictures or hand-lettered clues; a big clue bar on top for the active word. */
:root{--bg:#f4f7fb;--paper:#ffffff;--ink:#1f2a44;--muted:#66708a;--accent:#2f3e9e;--btn:#4fae94;--cluebg:#ffffff;--letter:#ffffff;--line:#1f2a44;--hl:#fff1b8;--cur:#ffd257;--ok:#cdeccf;--bad:#f7c9c0;--decor:#e3eaf5;
--display:"Baloo 2",system-ui,sans-serif;--hand:"Patrick Hand","Comic Sans MS",cursive;--body:"Nunito",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a28;--paper:#1e2638;--ink:#eef1f8;--muted:#a3adc4;--accent:#9fb0ff;--btn:#3f9a81;--cluebg:#232c40;--letter:#2a3349;--line:#c9d1e4;--hl:#4d4520;--cur:#7a6520;--ok:#24452c;--bad:#5a2a26;--decor:#1b2233;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a28;--paper:#1e2638;--ink:#eef1f8;--muted:#a3adc4;--accent:#9fb0ff;--btn:#3f9a81;--cluebg:#232c40;--letter:#2a3349;--line:#c9d1e4;--hl:#4d4520;--cur:#7a6520;--ok:#24452c;--bad:#5a2a26;--decor:#1b2233;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body)}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 40px}
h1{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1.05;margin:0;color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
button{font:inherit;font-weight:800;font-size:1rem;border:0;border-radius:999px;padding:.5rem 1rem;background:var(--btn);color:#fff;cursor:pointer}
button.alt{background:var(--accent);color:var(--paper);margin-left:auto}
button:focus-visible{outline:3px solid var(--cur);outline-offset:2px}
.now{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 12px;margin-bottom:12px;background:var(--paper);border:2px solid var(--line);border-radius:12px}
.now .e{font-size:2rem;line-height:1}.now .t{font-family:var(--hand);font-size:1.35rem;line-height:1.2}
.now .k{margin-left:auto;font-weight:800;color:var(--muted);font-size:.85rem;white-space:nowrap}
.gbox{overflow-x:auto}
.grid{display:grid;width:max-content;margin:0 auto;border:2.5px solid var(--line);background:var(--line);gap:1px}
.cell{width:var(--s);height:var(--s);position:relative;background:var(--letter);overflow:hidden}
.cell.decor{background:var(--line)}
.cell.clue{background:var(--cluebg);cursor:pointer;display:flex;flex-direction:column}
.half{flex:1;min-width:0;width:100%;display:grid;place-items:center;text-align:center;position:relative;min-height:0;padding:1px 2px}
.half+.half{border-top:1px solid var(--line)}.half:has(.arr.D){padding-bottom:6px}.half:has(.arr.A){padding-right:6px}
.half .tx{font-family:var(--hand);font-size:max(9px,calc(var(--s)*.2));line-height:1.02;text-transform:uppercase;display:block;word-break:keep-all;overflow-wrap:normal;hyphens:none}
.one .tx{font-size:calc(var(--s)*.23)}
.half .em{font-size:calc(var(--s)*.62);line-height:1}
.mix{display:flex;flex-direction:column;align-items:center;gap:1px}.mix .em{font-size:calc(var(--s)*.36)}.two .mix .em{font-size:calc(var(--s)*.2)}.two .mix{flex-direction:row;gap:2px}.mix .tx{font-weight:700}.two .em{font-size:calc(var(--s)*.34)}.two .tx{font-size:calc(var(--s)*.175)}
.arr{position:absolute;width:0;height:0}
.arr.A{right:0;top:50%;transform:translateY(-50%);border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:5px solid var(--ink)}
.arr.DA,.arr.AD{width:12px;height:12px;color:var(--ink);display:block}.arr svg{width:12px;height:12px;display:block}.arr.DA{bottom:1px;left:1px}.arr.AD{right:1px;top:1px}.half:has(.arr.DA){padding-bottom:10px}.half:has(.arr.AD){padding-right:12px}.cell.corner{background:var(--accent);color:var(--paper);display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:800;font-size:calc(var(--s)*.22);line-height:1}.arr.D{bottom:0;left:50%;transform:translateX(-50%);border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--ink)}
.half.act{background:var(--hl)}
.cell.let{cursor:pointer}
.cell.let .l{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:calc(var(--s)*.58);padding-top:4px}
.cell.let.hl{background:var(--hl)}.cell.let.cur{background:var(--cur)}
.cell.let.ok{background:var(--ok)}.cell.let.bad{background:var(--bad)}
.msg{text-align:center;font-family:var(--display);font-size:1.25rem;color:var(--btn);min-height:1.8rem;margin-top:12px}
.help{color:var(--muted);font-size:.9rem;margin-top:10px;text-align:center}
#kb{position:fixed;opacity:0;width:1px;height:1px;top:0;left:-9999px}
</style>
</head>
<body>
<div class="wrap">
<h1>Ikonkrydset</h1>
<div class="bar"><button id="hint">Hint</button><button id="check">Tjek løsning</button><button class="alt" id="reset">Start forfra</button></div>
<div class="now" id="now"><span class="e">👆</span><span class="t">Tryk på et billede eller et felt for at begynde</span></div>
<div class="gbox"><div class="grid" id="grid"></div></div>
<div class="msg" id="msg"></div>
<p class="help">Pilen viser, hvilken vej ordet skal skrives. En knækket pil betyder, at ordet starter i feltet ved siden af. Tryk to gange på et felt for at skifte retning.</p>
<input id="kb" autocomplete="off" autocapitalize="characters" aria-label="Skriv bogstav">
</div>
<script>
const P={"W": 10, "H": 12, "clue": [[0, 0], [0, 1], [0, 2], [0, 4], [0, 7], [0, 8], [1, 4], [1, 6], [2, 0], [2, 2], [2, 3], [2, 8], [3, 5], [3, 7], [4, 1], [4, 3], [4, 4], [4, 7], [4, 9], [5, 0], [5, 4], [5, 6], [6, 0], [6, 2], [6, 8], [7, 1], [7, 5], [7, 6], [7, 9], [8, 1], [8, 3], [8, 4], [8, 7], [9, 0], [9, 4], [9, 6], [9, 8], [10, 2], [10, 5], [11, 0], [11, 3], [11, 7]], "words": [{"ans": "AT", "d": "A", "r": 0, "c": 5, "cr": 0, "cc": 4, "k": "A", "em": "", "sh": "… LEGE", "lg": "Jeg elsker … lege"}, {"ans": "KLOG", "d": "A", "r": 1, "c": 0, "cr": 0, "cc": 0, "k": "DA", "em": "", "sh": "IKKE DUM", "lg": "Det modsatte af dum"}, {"ans": "JEG", "d": "A", "r": 1, "c": 7, "cr": 1, "cc": 6, "k": "A", "em": "", "sh": "IKKE DIG", "lg": "Ikke dig, men ..."}, {"ans": "EMMA", "d": "A", "r": 2, "c": 4, "cr": 2, "cc": 3, "k": "A", "em": "", "sh": "PIGENAVN", "lg": "Et pigenavn med 4 bogstaver"}, {"ans": "RAKET", "d": "A", "r": 3, "c": 0, "cr": 2, "cc": 0, "k": "DA", "em": "🚀", "sh": "", "lg": "Den flyver ud i rummet"}, {"ans": "SE", "d": "A", "r": 3, "c": 8, "cr": 3, "cc": 7, "k": "A", "em": "👀", "sh": "", "lg": "Det gør du med øjnene"}, {"ans": "UR", "d": "A", "r": 4, "c": 5, "cr": 4, "cc": 4, "k": "A", "em": "⌚", "sh": "", "lg": "Det viser, hvad klokken er"}, {"ans": "SÆL", "d": "A", "r": 5, "c": 1, "cr": 5, "cc": 0, "k": "A", "em": "🦭", "sh": "", "lg": "Dyr der ligger på stranden og svømmer i havet"}, {"ans": "ULV", "d": "A", "r": 5, "c": 7, "cr": 5, "cc": 6, "k": "A", "em": "🐺", "sh": "", "lg": "Vildt dyr der hyler"}, {"ans": "EGERN", "d": "A", "r": 6, "c": 3, "cr": 6, "cc": 2, "k": "A", "em": "🐿️", "sh": "", "lg": "Lille rødt dyr med busket hale, der samler nødder"}, {"ans": "FRØ", "d": "A", "r": 7, "c": 2, "cr": 7, "cc": 1, "k": "A", "em": "🐸", "sh": "", "lg": "Grønt dyr der hopper og kvækker"}, {"ans": "GÅ", "d": "A", "r": 7, "c": 7, "cr": 7, "cc": 6, "k": "A", "em": "🚶", "sh": "", "lg": "Det gør du med dine ben"}, {"ans": "OG", "d": "A", "r": 8, "c": 5, "cr": 8, "cc": 4, "k": "A", "em": "", "sh": "KAT … HUND", "lg": "Kat ... hund"}, {"ans": "HØ", "d": "A", "r": 8, "c": 8, "cr": 8, "cc": 7, "k": "A", "em": "", "sh": "TØRT GRÆS", "lg": "Tørt græs, som heste spiser"}, {"ans": "ØRE", "d": "A", "r": 9, "c": 1, "cr": 9, "cc": 0, "k": "A", "em": "👂", "sh": "", "lg": "Det hører du med"}, {"ans": "ER", "d": "A", "r": 10, "c": 0, "cr": 9, "cc": 0, "k": "DA", "em": "", "sh": "JEG … 9 ÅR", "lg": "Jeg ... 9 år gammel"}, {"ans": "NI", "d": "A", "r": 10, "c": 3, "cr": 10, "cc": 2, "k": "A", "em": "", "sh": "9", "lg": "Tallet 9 skrevet med bogstaver"}, {"ans": "NOTE", "d": "A", "r": 10, "c": 6, "cr": 10, "cc": 5, "k": "A", "em": "🎵", "sh": "", "lg": "Et tegn for en tone i musik"}, {"ans": "NY", "d": "A", "r": 11, "c": 1, "cr": 11, "cc": 0, "k": "A", "em": "🆕", "sh": "", "lg": "Det modsatte af gammel og brugt"}, {"ans": "STÅ", "d": "A", "r": 11, "c": 4, "cr": 11, "cc": 3, "k": "A", "em": "", "sh": "IKKE SIDDE", "lg": "Det modsatte af at sidde"}, {"ans": "ÅR", "d": "A", "r": 11, "c": 8, "cr": 11, "cc": 7, "k": "A", "em": "", "sh": "12 MÅNEDER", "lg": "Der er 12 måneder i et ..."}, {"ans": "RO", "d": "D", "r": 3, "c": 0, "cr": 2, "cc": 0, "k": "D", "em": "", "sh": "STILLE", "lg": "Stilhed. Nu skal der være ... i klassen"}, {"ans": "OS", "d": "D", "r": 7, "c": 0, "cr": 6, "cc": 0, "k": "D", "em": "", "sh": "DIG OG MIG", "lg": "Dig og mig er ..."}, {"ans": "LEA", "d": "D", "r": 1, "c": 1, "cr": 0, "cc": 1, "k": "D", "em": "", "sh": "PIGENAVN", "lg": "Et pigenavn med 3 bogstaver"}, {"ans": "SØ", "d": "D", "r": 5, "c": 1, "cr": 4, "cc": 1, "k": "D", "em": "", "sh": "VAND I PARKEN", "lg": "Vand i parken, hvor ænderne svømmer"}, {"ans": "ØRN", "d": "D", "r": 9, "c": 1, "cr": 8, "cc": 1, "k": "D", "em": "🦅", "sh": "", "lg": "Stor rovfugl"}, {"ans": "KNÆ", "d": "D", "r": 3, "c": 2, "cr": 2, "cc": 2, "k": "D", "em": "🦵", "sh": "MIDT PÅ", "lg": "Det sidder midt på benet"}, {"ans": "FAR", "d": "D", "r": 7, "c": 2, "cr": 6, "cc": 2, "k": "D", "em": "", "sh": "MOR OG …", "lg": "Mor og ..."}, {"ans": "EG", "d": "D", "r": 0, "c": 3, "cr": 0, "cc": 2, "k": "AD", "em": "🌳", "sh": "TRÆ", "lg": "Stort træ, hvor agern vokser"}, {"ans": "LER", "d": "D", "r": 5, "c": 3, "cr": 4, "cc": 3, "k": "D", "em": "🏺", "sh": "LAVET AF", "lg": "Krukker og skåle laves af det"}, {"ans": "EN", "d": "D", "r": 9, "c": 3, "cr": 8, "cc": 3, "k": "D", "em": "", "sh": "1", "lg": "Tallet 1 skrevet med bogstaver"}, {"ans": "ET", "d": "D", "r": 2, "c": 4, "cr": 1, "cc": 4, "k": "D", "em": "", "sh": "… ÆBLE", "lg": "... æble (ikke en æble)"}, {"ans": "GØ", "d": "D", "r": 6, "c": 4, "cr": 5, "cc": 4, "k": "D", "em": "🐶", "sh": "SIGER", "lg": "Det siger en hund: vov vov"}, {"ans": "IS", "d": "D", "r": 10, "c": 4, "cr": 9, "cc": 4, "k": "D", "em": "🍦", "sh": "", "lg": "Kold og sød. Spises om sommeren"}, {"ans": "ARM", "d": "D", "r": 0, "c": 5, "cr": 0, "cc": 4, "k": "AD", "em": "💪", "sh": "", "lg": "Den sidder mellem skulder og hånd"}, {"ans": "UGE", "d": "D", "r": 4, "c": 5, "cr": 3, "cc": 5, "k": "D", "em": "", "sh": "7 DAGE", "lg": "Der er 7 dage i en ..."}, {"ans": "OP", "d": "D", "r": 8, "c": 5, "cr": 7, "cc": 5, "k": "D", "em": "", "sh": "IKKE NED", "lg": "Det modsatte af ned"}, {"ans": "MOR", "d": "D", "r": 2, "c": 6, "cr": 1, "cc": 6, "k": "D", "em": "", "sh": "FAR OG …", "lg": "Far og ..."}, {"ans": "NÅ", "d": "D", "r": 10, "c": 6, "cr": 9, "cc": 6, "k": "D", "em": "", "sh": "… BUSSEN", "lg": "Skynd dig, så du kan ... bussen"}, {"ans": "JA", "d": "D", "r": 1, "c": 7, "cr": 0, "cc": 7, "k": "D", "em": "", "sh": "IKKE NEJ", "lg": "Det modsatte af nej"}, {"ans": "UNG", "d": "D", "r": 5, "c": 7, "cr": 4, "cc": 7, "k": "D", "em": "", "sh": "IKKE GAMMEL", "lg": "Det modsatte af gammel"}, {"ans": "BO", "d": "D", "r": 9, "c": 7, "cr": 8, "cc": 7, "k": "D", "em": "", "sh": "HVOR … DU?", "lg": "Hvor ... du? Altså: hvor er dit hjem?"}, {"ans": "SÅL", "d": "D", "r": 3, "c": 8, "cr": 2, "cc": 8, "k": "D", "em": "", "sh": "UNDER SKOEN", "lg": "Den er under skoen"}, {"ans": "ÅH", "d": "D", "r": 7, "c": 8, "cr": 6, "cc": 8, "k": "D", "em": "", "sh": "…, HVOR SØDT!", "lg": "..., hvor er den sød!"}, {"ans": "TÅ", "d": "D", "r": 10, "c": 8, "cr": 9, "cc": 8, "k": "D", "em": "🦶", "sh": "DU HAR 10", "lg": "Du har 10 af dem på fødderne"}, {"ans": "UGLE", "d": "D", "r": 0, "c": 9, "cr": 0, "cc": 8, "k": "AD", "em": "🦉", "sh": "", "lg": "Fugl der er vågen om natten og siger uhu"}, {"ans": "VI", "d": "D", "r": 5, "c": 9, "cr": 4, "cc": 9, "k": "D", "em": "", "sh": "DU OG JEG", "lg": "Du og jeg er ..."}, {"ans": "ØRER", "d": "D", "r": 8, "c": 9, "cr": 7, "cc": 9, "k": "D", "em": "👂", "sh": "TO", "lg": "Du har to af dem på hovedet"}]};const W=P.W,H=P.H;const clue=new Set(P.clue.map(x=>x[0]+','+x[1]));
const S=Math.max(34,Math.min(62,Math.floor((Math.min(document.documentElement.clientWidth,720)-32-(W+1)-6)/W)));
const grid=document.getElementById('grid');grid.style.setProperty('--s',S+'px');grid.style.gridTemplateColumns=`repeat(${W},${S}px)`;
const cells={},byClue={};const BENT={DA:`<svg viewBox="0 0 12 12"><path d="M2 0V8H9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 5L12 8L8 11Z" fill="currentColor"/></svg>`,AD:`<svg viewBox="0 0 12 12"><path d="M0 2H8V9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 8L8 12L11 8Z" fill="currentColor"/></svg>`};
P.words.forEach((w,i)=>{w.id=i;(byClue[w.cr+','+w.cc]??=[]).push(w);[...w.ans].forEach((ch,k)=>{const key=(w.r+(w.d=='D'?k:0))+','+(w.c+(w.d=='A'?k:0));(cells[key]??={ans:ch,words:[],val:''}).words.push(i)})});

for(let r=0;r<H;r++)for(let c=0;c<W;c++){const k=r+','+c,d=document.createElement('div');d.className='cell';
 if(clue.has(k)){const ws=(byClue[k]||[]).sort((a,b)=>(/^A/.test(a.k)?0:1)-(/^A/.test(b.k)?0:1));
  if(!ws.length){if(k==='0,0'){d.classList.add('corner');d.innerHTML='IKON<br>KRYDS'}else{d.classList.add('decor')}}
  else{d.classList.add('clue',ws.length>1?'two':'one');ws.forEach(w=>{const h=document.createElement('div');h.className='half';h.innerHTML=(w.em&&w.sh?`<span class="mix"><span class="em">${w.em}</span><span class="tx">${w.sh}</span></span>`:w.em?`<span class="em">${w.em}</span>`:`<span class="tx">${w.sh}</span>`)+`<span class="arr ${w.k}">${BENT[w.k]||""}</span>`;h.onclick=e=>{e.stopPropagation();sel={r:w.r,c:w.c,w:w.id};draw();focusKb()};w.half=h;d.appendChild(h)})}}
 else{d.classList.add('let');d.innerHTML='<span class="l"></span>';cells[k].el=d;d.onclick=()=>pick(r,c)}
 grid.appendChild(d)}
let sel=null;const kb=document.getElementById('kb');
function focusKb(){kb.focus({preventScroll:true})}
function wc(w){return [...w.ans].map((_,k)=>(w.r+(w.d=='D'?k:0))+','+(w.c+(w.d=='A'?k:0)))}
function pick(r,c){const o=cells[r+','+c];if(sel&&sel.r==r&&sel.c==c&&o.words.length>1)sel.w=o.words.find(x=>x!=sel.w);else sel={r,c,w:(sel&&o.words.includes(sel.w))?sel.w:o.words[0]};draw();focusKb()}
function draw(){for(const o of Object.values(cells)){o.el.classList.remove('hl','cur');o.el.querySelector('.l').textContent=o.val}
 P.words.forEach(w=>w.half.classList.toggle('act',!!sel&&sel.w==w.id));
 const now=document.getElementById('now');if(!sel)return;const w=P.words[sel.w];
 wc(w).forEach(k=>cells[k].el.classList.add('hl'));cells[sel.r+','+sel.c].el.classList.add('cur');
 now.innerHTML=`<span class="e">${w.em||'✏️'}</span><span class="t">${w.lg}</span><span class="k">${w.ans.length} bogstaver ${w.d=='A'?'→':'↓'}</span>`}
function step(n){const ks=wc(P.words[sel.w]),i=ks.indexOf(sel.r+','+sel.c)+n;if(i>=0&&i<ks.length)[sel.r,sel.c]=ks[i].split(',').map(Number)}
function clearMarks(){for(const o of Object.values(cells))o.el.classList.remove('ok','bad');document.getElementById('msg').textContent=''}
function put(ch){if(!sel)return;clearMarks();cells[sel.r+','+sel.c].val=ch;step(1);draw();save()}
kb.addEventListener('input',()=>{const v=kb.value.toUpperCase().replace(/[^A-ZÆØÅ]/g,'');kb.value='';if(v)put(v.slice(-1))});
kb.addEventListener('keydown',e=>{if(!sel)return;if(e.key=='Backspace'){e.preventDefault();clearMarks();if(!cells[sel.r+','+sel.c].val)step(-1);cells[sel.r+','+sel.c].val='';draw();save()}
 else if(e.key.startsWith('Arrow')){e.preventDefault();const dr={ArrowUp:-1,ArrowDown:1}[e.key]||0,dc={ArrowLeft:-1,ArrowRight:1}[e.key]||0,k=(sel.r+dr)+','+(sel.c+dc);if(cells[k]){const nw=cells[k].words.find(i=>P.words[i].d==(dc?'A':'D'));sel={r:sel.r+dr,c:sel.c+dc,w:nw??cells[k].words[0]};draw()}}});
document.getElementById('check').onclick=()=>{let bad=0,empty=0;for(const o of Object.values(cells)){o.el.classList.remove('ok','bad');if(!o.val)empty++;else if(o.val==o.ans)o.el.classList.add('ok');else{o.el.classList.add('bad');bad++}}
 document.getElementById('msg').textContent=!bad&&!empty?'Hurra! Du har løst hele krydsordet! 🎉':bad?`${bad} bogstaver er forkerte. Prøv igen!`:`Alt er rigtigt indtil nu. ${empty} felter mangler.`};
document.getElementById('hint').onclick=()=>{const list=sel?wc(P.words[sel.w]):[];const k=list.find(k=>cells[k].val!=cells[k].ans)||Object.keys(cells).find(k=>cells[k].val!=cells[k].ans);if(k){cells[k].val=cells[k].ans;clearMarks();draw();save()}};
document.getElementById('reset').onclick=()=>{for(const o of Object.values(cells))o.val='';clearMarks();sel=null;document.getElementById('now').innerHTML='<span class="e">👆</span><span class="t">Tryk på et billede eller et felt for at begynde</span>';draw();save()};
function save(){try{localStorage.setItem('ik1',JSON.stringify(Object.fromEntries(Object.entries(cells).map(([k,o])=>[k,o.val]))))}catch(e){}}
try{const s=JSON.parse(localStorage.getItem('ik1')||'{}');for(const k in s)if(cells[k])cells[k].val=s[k]}catch(e){}
function fit(){document.querySelectorAll('.half .tx').forEach(el=>{el.style.fontSize='';let f=parseFloat(getComputedStyle(el).fontSize);const box=el.closest('.half');while(f>7&&(el.scrollWidth>el.clientWidth+0.5||box.scrollHeight>box.clientHeight+1)){f-=0.5;el.style.fontSize=f+'px'}})}
document.fonts?document.fonts.ready.then(fit):fit();fit();
draw();
</script>
</body>
</html>
